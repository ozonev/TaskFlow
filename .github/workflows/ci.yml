name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  checks: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      taskflow-agent: ${{ steps.filter.outputs.taskflow-agent }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '**/*.csproj'
              - '**/*.sln'
              - '**/*.slnx'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'
            taskflow-agent:
              - 'tools/taskflow-agent/**'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TaskFlow.slnx

      - name: Build
        run: dotnet build TaskFlow.slnx --configuration Release --no-restore

      - name: Check for supported test reporter
        id: reporter
        shell: bash
        run: |
          if grep -rlE "Microsoft\.Testing\.Extensions\.TrxReport|JunitXml\.TestLogger" tests/**/*.csproj > /dev/null 2>&1; then
            echo "has-reporter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-reporter=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: >
          dotnet test TaskFlow.slnx --configuration Release --no-build
          --filter-not-trait "Category=Postgres"
          ${{ steps.reporter.outputs.has-reporter == 'true' && '--report-trx --results-directory ./TestResults' || '' }}

      - name: Publish test results
        if: always() && steps.reporter.outputs.has-reporter == 'true'
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: 'TestResults/*.trx'
          reporter: dotnet-trx

  taskflow-agent-test:
    needs: changes
    if: needs.changes.outputs.taskflow-agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/taskflow-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/taskflow-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
